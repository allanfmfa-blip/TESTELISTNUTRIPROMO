<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Eventos & Retrofits</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-inauguracao: #10b981;
      --accent-retrofit: #f59e0b;
      --accent-outro: #3b82f6;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 100px; /* Espaço para o painel de controle */
    }

    /* Cabeçalho Fixo na TV */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      padding: 20px 40px;
      border-bottom: 2px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .header-title h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .badge-live {
      background-color: #ef4444;
      color: white;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .header-clock {
      text-align: right;
    }

    .clock-time {
      font-size: 2rem;
      font-weight: 700;
      font-family: monospace;
      color: #ffffff;
    }

    .clock-date {
      font-size: 1rem;
      color: var(--text-muted);
      text-transform: capitalize;
    }

    /* Lista de Eventos */
    .container {
      max-width: 1200px;
      width: 90%;
      margin: 30px auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .event-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px 32px;
      display: grid;
      grid-template-columns: 140px 1fr 180px;
      align-items: center;
      gap: 24px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .event-card.inauguracao {
      border-left: 8px solid var(--accent-inauguracao);
    }

    .event-card.retrofit {
      border-left: 8px solid var(--accent-retrofit);
    }

    .event-card.outro {
      border-left: 8px solid var(--accent-outro);
    }

    .event-date {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .event-date .day {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
      color: #ffffff;
    }

    .event-date .month {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .event-info h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .event-info p {
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    .event-badge {
      text-align: center;
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-inauguracao {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--accent-inauguracao);
      border: 1px solid var(--accent-inauguracao);
    }

    .badge-retrofit {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--accent-retrofit);
      border: 1px solid var(--accent-retrofit);
    }

    .badge-outro {
      background-color: rgba(59, 130, 246, 0.15);
      color: var(--accent-outro);
      border: 1px solid var(--accent-outro);
    }

    /* Painel de Controle Flutuante (Ocultável) */
    .control-panel {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--card-border);
      padding: 12px 24px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 1000;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .control-panel.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 50px);
    }

    .control-panel input {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      width: 280px;
      font-size: 0.9rem;
    }

    .control-panel button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .control-panel button:hover {
      background: #2563eb;
    }

    .btn-toggle-scroll {
      background: #10b981 !important;
    }

    .btn-toggle-scroll.paused {
      background: #ef4444 !important;
    }

    .btn-hide-panel {
      background: #475569 !important;
    }

    /* Botão Flutuante para Mostrar o Painel Novamente */
    .btn-show-controls {
      position: fixed;
      bottom: 15px;
      right: 15px;
      background: rgba(30, 41, 59, 0.8);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>Cronograma de Eventos</h1>
      <span class="badge-live">Ao Vivo</span>
    </div>
    <div class="header-clock">
      <div class="clock-time" id="clock-time">00:00:00</div>
      <div class="clock-date" id="clock-date">Carregando data...</div>
    </div>
  </header>

  <main class="container" id="events-container">
    <!-- Os cartões de eventos serão carregados dinamicamente via JS -->
  </main>

  <!-- Painel de Configurações -->
  <div class="control-panel" id="control-panel">
    <input type="text" id="csv-url-input" placeholder="URL do CSV do Google Sheets...">
    <button onclick="loadSheetsCSV()">Carregar CSV</button>
    <button id="btn-scroll" class="btn-toggle-scroll" onclick="toggleScroll()">PAUSAR ROLAGEM</button>
    <button class="btn-hide-panel" onclick="togglePanel(false)">Ocultar Barra</button>
  </div>

  <button class="btn-show-controls" onclick="togglePanel(true)" title="Mostrar Configurações">⚙️</button>

  <script>
    // --- Dados de Exemplo Padrão (Caso nenhuma URL seja fornecida) ---
    const defaultEvents = [
      { date: "Dia 02", month: "Nov", title: "Loja Shopping SP", desc: "Retrofit Completo de Fachada", type: "retrofit" },
      { date: "Dia 05", month: "Nov", title: "Loja Centro RJ", desc: "Grande Inauguração Oficial", type: "inauguracao" },
      { date: "Dia 09", month: "Nov", title: "Loja Campinas", desc: "Ampliação da Área de Vendas", type: "retrofit" },
      { date: "Dia 12", month: "Nov", title: "Loja Curitiba", desc: "Inauguração Nova Filial", type: "inauguracao" },
      { date: "Dia 15", month: "Nov", title: "Loja Belo Horizonte", desc: "Manutenção Preventiva e Pintura", type: "retrofit" },
      { date: "Dia 18", month: "Nov", title: "Loja Porto Alegre", desc: "Inauguração Conceito Flagship", type: "inauguracao" },
      { date: "Dia 22", month: "Nov", title: "Loja Salvador", desc: "Reforma de Iluminação LED", type: "retrofit" },
      { date: "Dia 25", month: "Nov", title: "Loja Brasília", desc: "Inauguração Ponto de Atendimento", type: "inauguracao" },
      { date: "Dia 28", month: "Nov", title: "Loja Recife", desc: "Retrofit do Setor Administrativo", type: "retrofit" },
      { date: "Dia 30", month: "Nov", title: "Loja Fortaleza", desc: "Inauguração Oficial de Fim de Ano", type: "inauguracao" }
    ];

    // --- Relógio Digital ---
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      document.getElementById('clock-time').textContent = `${hours}:${minutes}:${seconds}`;
      
      const options = { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' };
      document.getElementById('clock-date').textContent = now.toLocaleDateString('pt-BR', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Renderização dos Eventos ---
    function renderEvents(events) {
      const container = document.getElementById('events-container');
      container.innerHTML = '';

      events.forEach(evt => {
        const typeClass = evt.type.toLowerCase().includes('inaugur') ? 'inauguracao' : 
                          evt.type.toLowerCase().includes('retro') ? 'retrofit' : 'outro';
        
        const typeLabel = typeClass === 'inauguracao' ? 'Inauguração' : 
                          typeClass === 'retrofit' ? 'Retrofit' : 'Evento';

        const card = document.createElement('div');
        card.className = `event-card ${typeClass}`;
        card.innerHTML = `
          <div class="event-date">
            <span class="day">${evt.date}</span>
            <span class="month">${evt.month || ''}</span>
          </div>
          <div class="event-info">
            <h2>${evt.title}</h2>
            <p>${evt.desc}</p>
          </div>
          <div class="event-badge badge-${typeClass}">
            ${typeLabel}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- Mecanismo de Rolagem Automática (Auto-Scroll) Preciso para TV ---
    let scrolling = true;
    let currentScrollPos = 0;
    const speed = 0.8; // Velocidade da rolagem (ajuste se quiser mais rápido ou mais lento)
    let pauseTimer = null;

    function autoScrollStep() {
      if (scrolling) {
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;

        if (maxScroll > 0) {
          currentScrollPos += speed;
          window.scrollTo(0, Math.floor(currentScrollPos));

          // Quando chega no final da página
          if (currentScrollPos >= maxScroll) {
            scrolling = false;
            // Aguarda 3 segundos no final e volta suavemente ao topo
            pauseTimer = setTimeout(() => {
              window.scrollTo({ top: 0, behavior: 'smooth' });
              setTimeout(() => {
                currentScrollPos = 0;
                scrolling = true;
                requestAnimationFrame(autoScrollStep);
              }, 1200); // Tempo para o scroll suave de volta subir completo
            }, 3000);
            return;
          }
        }
      }
      requestAnimationFrame(autoScrollStep);
    }

    function toggleScroll() {
      scrolling = !scrolling;
      const btn = document.getElementById('btn-scroll');
      if (scrolling) {
        btn.textContent = 'PAUSAR ROLAGEM';
        btn.classList.remove('paused');
        currentScrollPos = window.scrollY;
        requestAnimationFrame(autoScrollStep);
      } else {
        btn.textContent = 'INICIAR ROLAGEM';
        btn.classList.add('paused');
        if (pauseTimer) clearTimeout(pauseTimer);
      }
    }

    function togglePanel(show) {
      const panel = document.getElementById('control-panel');
      if (show) {
        panel.classList.remove('hidden');
      } else {
        panel.classList.add('hidden');
      }
    }

    // --- Integração com Google Sheets (CSV Publicado) ---
    function loadSheetsCSV() {
      const url = document.getElementById('csv-url-input').value.trim();
      if (!url) {
        alert('Por favor, insira o link CSV válido do Google Sheets.');
        return;
      }

      localStorage.setItem('sheets_csv_url', url);

      fetch(url)
        .then(response => response.text())
        .then(csvText => {
          const rows = csvText.split('\n').map(row => row.split(','));
          const fetchedEvents = [];

          // Pula o cabeçalho (linha 0) e lê as linhas
          for (let i = 1; i < rows.length; i++) {
            if (rows[i].length >= 3 && rows[i][0].trim() !== '') {
              fetchedEvents.push({
                date: rows[i][0].replace(/"/g, '').trim(),
                month: rows[i][1] ? rows[i][1].replace(/"/g, '').trim() : '',
                title: rows[i][2] ? rows[i][2].replace(/"/g, '').trim() : '',
                desc: rows[i][3] ? rows[i][3].replace(/"/g, '').trim() : '',
                type: rows[i][4] ? rows[i][4].replace(/"/g, '').trim() : 'outro'
              });
            }
          }

          if (fetchedEvents.length > 0) {
            renderEvents(fetchedEvents);
            currentScrollPos = 0;
            window.scrollTo(0, 0);
          } else {
            alert('Nenhum dado encontrado no CSV.');
          }
        })
        .catch(err => {
          console.error(err);
          alert('Erro ao carregar o CSV. Verifique a URL e a conexão com a internet.');
        });
    }

    // --- Inicialização ---
    window.onload = () => {
      const savedUrl = localStorage.getItem('sheets_csv_url');
      if (savedUrl) {
        document.getElementById('csv-url-input').value = savedUrl;
        loadSheetsCSV();
      } else {
        renderEvents(defaultEvents);
      }

      // Inicia a rolagem contínua
      requestAnimationFrame(autoScrollStep);

      // Auto-atualização dos dados do CSV a cada 10 minutos (se houver URL)
      setInterval(() => {
        const savedUrl = localStorage.getItem('sheets_csv_url');
        if (savedUrl) loadSheetsCSV();
      }, 10 * 60 * 1000);
    };
  </script>
</body>
</html>
